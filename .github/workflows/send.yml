name: send

# Mail goes out during business hours: Mon-Fri 8am-4pm Central (DST-aware,
# checked in src/schedule.py). GitHub's cron runs hours late, so send starts
#   - right after each prepare run finishes (workflow_run), and
#   - at four fallback slots, 13:47 / 15:47 / 17:47 / 19:47 UTC.
# A run outside the window exits without sending; DAILY_SEND_CAP is per day,
# so the extra runs can't push the total past it.

on:
  workflow_run:
    workflows: [prepare]
    types: [completed]
  schedule:
    - cron: "47 13,15,17,19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even outside business hours"
        type: boolean
        default: false

# One send at a time: two overlapping runs could both read the same draft as
# unsent and mail it twice.
concurrency:
  group: send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # The reply scan after sending labels each new reply with Gemini; after a
    # gap in runs that backlog pushed the job past 20 minutes (2026-09-28).
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Which Gemini model labels replies; a repository variable, same as
      # prepare.yml. Unset falls back to src/replies.py's default.
      GEMINI_CLASSIFY_MODEL: ${{ vars.GEMINI_CLASSIFY_MODEL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # Summary recipient (approval happens in the Sheet, not by email).
      APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
      ORG_NAME: ${{ secrets.ORG_NAME }}
      ORG_PHYSICAL_ADDRESS: ${{ secrets.ORG_PHYSICAL_ADDRESS }}
      UNSUBSCRIBE_MAILTO: ${{ secrets.UNSUBSCRIBE_MAILTO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      DAILY_SEND_CAP: ${{ secrets.DAILY_SEND_CAP }}
      SEND_INTERVAL_SECONDS: "30"
      TARGET_TERM: "Spring 2027"
      CAMPAIGN_START: "2026-08-18"
      ALUMNI_TARGET_SHARE: "0.35"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main send ${{ inputs.force && '--force' || '' }}
      # Read-only inbox scan: records replies, out-of-office notices and bounces
      # so the reply rate and deliverability numbers stay current. Never fails
      # the job — the sending above is what matters.
      - run: python -m src.main replies
        continue-on-error: true
