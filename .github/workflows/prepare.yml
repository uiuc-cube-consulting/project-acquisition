name: prepare

# PRIMARY TRIGGER: cron-job.org POSTs a workflow_dispatch at 6:30am Central
# Mon-Fri (fine-grained token with Actions: read & write on this repo only;
# it expires, so renew it before then). The crons below are the fallback.
#
# GitHub's cron is best-effort: since Sept 2026 runs have started 4-8 hours
# late (12:00 UTC fired at 17:00-20:00 UTC). So this fires at three early slots
# (10:17 / 12:17 / 14:17 UTC = 5:17 / 7:17 / 9:17 am CDT, an hour earlier in
# CST). Whichever starts first drafts the day's batch; the rest see it and exit
# (src/schedule.py). Off the top of the hour, where GitHub's queue is busiest.

on:
  schedule:
    - cron: "17 10,12,14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare another batch even if today's already exists"
        type: boolean
        default: false

# Never two prepares at once (two slots can start together after a long delay).
concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Drafting is batched (DRAFT_BATCH_SIZE defaults to 5) and Gemini calls are
    # paced. Missing batch entries are retried individually; sourcing and quota
    # backoff also take time. Allow a slow run to finish without losing drafts
    # whose Apollo credits were already spent.
    timeout-minutes: 45
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Which Gemini model writes the emails. A repository variable, not a
      # secret: it is not a credential, and Google retires models, so swapping
      # one has to be possible without a code change and a merge (Settings →
      # Secrets and variables → Actions → Variables). Unset it arrives as "",
      # which env_str treats as unset, falling back to src/draft.py's default.
      GEMINI_DRAFT_MODEL: ${{ vars.GEMINI_DRAFT_MODEL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      ALUMNI_SHEET_ID: ${{ secrets.ALUMNI_SHEET_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # Summary recipient (approval happens in the Sheet, not by email).
      APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
      ORG_NAME: ${{ secrets.ORG_NAME }}
      ORG_PHYSICAL_ADDRESS: ${{ secrets.ORG_PHYSICAL_ADDRESS }}
      UNSUBSCRIBE_MAILTO: ${{ secrets.UNSUBSCRIBE_MAILTO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      DAILY_PREPARE_TARGET: ${{ secrets.DAILY_PREPARE_TARGET }}
      # --- Spring 2027 campaign ---
      # The semester the outreach pitches (appears in the subject and body).
      TARGET_TERM: "Spring 2027"
      CAMPAIGN_START: "2026-08-18"
      # Reserve 65% of every batch for NON-alumni discovery. Before quotas, the
      # alumni-first sort took every slot on any day the Alumni tab was full, so
      # founders / Chicago businesses / big tech were never reached at all.
      ALUMNI_TARGET_SHARE: "0.35"
      DISCOVERY_PROFILES_PER_RUN: "3"
      # Reserve 35% of every batch for big, well-known companies: the named list
      # in config/enterprise_targets.yaml plus large Chicago-HQ firms.
      ENTERPRISE_TARGET_SHARE: "0.35"
      ENTERPRISE_COMPANIES_PER_RUN: "12"
      # Drafts are written pre-approved; the send job mails them unattended.
      AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main prepare ${{ inputs.force && '--force' || '' }}
