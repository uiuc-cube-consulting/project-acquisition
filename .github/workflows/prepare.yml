name: prepare

# Runs Mon-Fri at 06:00 CT (11:00 UTC during CST, 12:00 UTC during CDT)
# We pick 12:00 UTC so the job lands at 6am during winter / 7am during summer.
# Tighten this if you want to handle DST more precisely.

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Gemini's free tier is ~5 req/min and drafting is one call per lead, so a
    # 15-lead batch needs ~3-4 minutes of paced calls plus sourcing. The old
    # 15-minute cap could kill the job mid-batch, losing drafts whose Apollo
    # credits were already spent.
    timeout-minutes: 45
    env:
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      ALUMNI_SHEET_ID: ${{ secrets.ALUMNI_SHEET_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # Summary recipient (approval happens in the Sheet, not by email).
      APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
      ORG_NAME: ${{ secrets.ORG_NAME }}
      ORG_PHYSICAL_ADDRESS: ${{ secrets.ORG_PHYSICAL_ADDRESS }}
      UNSUBSCRIBE_MAILTO: ${{ secrets.UNSUBSCRIBE_MAILTO }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
      DAILY_PREPARE_TARGET: ${{ secrets.DAILY_PREPARE_TARGET }}
      # --- Spring 2027 campaign ---
      # The semester the outreach pitches (appears in the subject and body).
      TARGET_TERM: "Spring 2027"
      CAMPAIGN_START: "2026-08-18"
      # Reserve 65% of every batch for NON-alumni discovery. Before quotas, the
      # alumni-first sort took every slot on any day the Alumni tab was full, so
      # founders / Chicago businesses / big tech were never reached at all.
      ALUMNI_TARGET_SHARE: "0.35"
      DISCOVERY_PROFILES_PER_RUN: "3"
      # Drafts are written pre-approved; the send job mails them unattended.
      AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main prepare
