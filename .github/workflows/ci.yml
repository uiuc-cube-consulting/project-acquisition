name: ci

# Checks every pull request (and main after a merge) before it can email anyone.
# Uses no credentials, and never runs prepare/send — it only lints and tests the code.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test issue claim label sync (offline)
        run: node --test .github/scripts/claim-labels.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest

      - name: No merge conflict markers
        run: |
          ! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'

      - name: Dashboard data is valid JSON
        run: python -m json.tool dashboard/data.json > /dev/null
