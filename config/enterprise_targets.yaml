# Well-known companies to pitch every day, so CUBE lands recognizable names and
# not only startups and small businesses.
#
# `prepare` reserves ENTERPRISE_TARGET_SHARE of each batch for big companies. Each
# run it takes ENTERPRISE_COMPANIES_PER_RUN companies from this list that have
# NOT been contacted yet (company dedupe checks both the name and the domain),
# rotating by day, and searches each one for the people most likely to sponsor
# a student project: strategy, innovation, analytics, corporate development,
# product and operations leaders.
#
# Searching is free; only revealing the chosen person's email costs a credit.
# Once a company has been emailed it drops out of the rotation for good, so keep
# adding to this list. Anyone on the team can: name + primary email domain.
# Order matters a little — Illinois companies score higher, so they go first.

titles:
  - "Strategy"
  - "Corporate Strategy"
  - "Corporate Development"
  - "Innovation"
  - "Transformation"
  - "Analytics"
  - "Data Science"
  - "Business Development"
  - "Partnerships"
  - "Product"
  - "Operations"
  - "University Relations"
  - "Campus"

seniorities:
  - "vp"
  - "head"
  - "director"

