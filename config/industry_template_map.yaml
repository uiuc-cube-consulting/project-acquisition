# Maps Apollo industry tags to one of the 4 outreach templates.
#
# Matching rule (see src/template.py):
#   - Case-insensitive, whole words/phrases only ("mobile" does not
#     match "automobiles").
#   - The LONGEST matching keyword across all templates wins.
#   - Ties between equal-length keywords go to the template listed first.
#   - No match → `default`.
# Tip: prefer Apollo's exact LinkedIn industry names as keywords.

default: business

mappings:
  business:
    - "consulting"
    - "marketing"
    - "advertising"
    - "retail"
    - "consumer"
    - "food"
    - "real estate"
    - "education"
    - "non-profit"
    - "venture capital"
    - "investment"
    - "private equity"
    - "financial services"
    - "banking"
    - "pharmaceuticals"               # NEW (judgment call, flagged in PR)
    - "hospital & health care"        # NEW (judgment call, flagged in PR)

  hybrid_product:
    - "saas"
    - "internet"
    - "e-commerce"
    - "mobile"
    - "fintech"
    - "edtech"
    - "e-learning"                    # NEW
    - "healthtech"
    - "logistics"

  technical_software:
    - "computer software"
    - "information technology"
    - "artificial intelligence"
    - "machine learning"
    - "data"
    - "cybersecurity"
    - "computer & network security"   # NEW
    - "network security"              # NEW
    - "cloud"
    - "developer tools"

  technical_engineering:
    - "semiconductors"
    - "electronics"
    - "robotics"
    - "aerospace"
    - "defense & space"               # NEW
    - "defense"                       # NEW
    - "automotive"
    - "automobiles"                   # NEW
    - "hardware"
    - "manufacturing"
    - "renewables"
    - "energy"
    - "biotechnology"
    - "medical devices"
    - "industrial"
    - "telecommunications"            # NEW (judgment call, flagged in PR)